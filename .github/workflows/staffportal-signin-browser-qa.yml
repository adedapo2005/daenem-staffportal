name: StaffPortal V180 Sign-In and Create Account Browser QA

on:
  pull_request:
    branches:
      - feature/staffportal-mobile-auth-takeover-01
    paths:
      - 'src/auth.tsx'
      - 'src/signin-experience.tsx'
      - 'src/signin-experience.css'
      - 'qa/signin/**'
      - 'scripts/test-signin-browser.cjs'
      - 'vite.signin-browser-qa.config.ts'
      - '.github/workflows/staffportal-signin-browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signin_browser_contract:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact locked application dependencies
        run: npm ci --no-audit --no-fund
      - name: Install isolated real browser QA runtime
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Verify V180 Sign-In and Create Account layout at seven resolutions
        run: node scripts/test-signin-browser.cjs
      - name: Existing release blocker and typecheck contracts
        run: |
          node scripts/check-signin-release-blockers.mjs
          npm run typecheck
      - name: Build approved StaffPortal candidate
        run: npm run build
      - name: Production remains protected
        shell: bash
        run: |
          test "$(node -p "require('./delivery/current-state.json').productionDeployAuthorized")" = "false"
          test "$(node -p "require('./delivery/current-state.json').productionMigrationAuthorized")" = "false"
