name: Staff Portal API Worker Deployment
env:
  STAFFPORTAL_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.sha }}


on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY_STAFFPORTAL_API to authorize this manual API Worker deployment
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy-api:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY_STAFFPORTAL_API'
    runs-on: ubuntu-latest
    environment: staffportal-api-production
    steps:
      - name: Checkout Staff Portal
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate active infrastructure boundary
        run: npm run check:infrastructure-boundary

      - name: Typecheck
        run: npm run typecheck

      - name: Validate API Worker without deployment
        run: npx wrangler deploy --dry-run --outdir=/tmp/daenem-staffportal-worker-dry-run --config wrangler.jsonc

      - name: Deploy only the Staff Portal API Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc

      # Database migrations are intentionally not part of this workflow.
      # They require a separate, explicitly authorized compatibility release.
