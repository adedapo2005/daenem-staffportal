name: StaffPortal Staging Deployment History

on:
  push:
    branches:
      - rollback/staffportal-staging-20261017
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rollback:
    name: Roll back StaffPortal staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staffportal-api-staging
      url: https://daenem-staffportal-api-staging.adedapo2005.workers.dev/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Roll back to pre-regression deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          account_id="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID_RAW" | tr -d '[:space:]')"
          if [ -z "$account_id" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is empty"
            exit 1
          fi
          export CLOUDFLARE_ACCOUNT_ID="$account_id"
          npx wrangler rollback 7462b450-5a02-4a2a-ad8c-e1639c0cf66d --config wrangler.staffportal-staging.jsonc --yes

      - name: Verify staging health
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 https://daenem-staffportal-api-staging.adedapo2005.workers.dev/health
