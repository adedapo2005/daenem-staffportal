name: StaffPortal Microsoft Organizations Staging QA

on:
  pull_request:
    branches:
      - feature/staffportal-mobile-auth-takeover-01
    paths:
      - 'worker/provider-auth.ts'
      - 'worker/microsoft-organizations.ts'
      - 'worker/microsoft-account-link.ts'
      - 'src/auth.tsx'
      - 'migrations/0101_staffportal_external_identity_links.sql'
      - 'scripts/test-microsoft-organizations.mjs'
      - '.github/workflows/staffportal-microsoft-organizations-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Staging-only organizations security regression
        run: |
          node scripts/test-microsoft-organizations.mjs
          python3 scripts/test-microsoft-identity-migration.py
          python3 scripts/test-microsoft-link-transaction.py
      - name: TypeScript and approved Sign-In release gates
        run: |
          npm run typecheck
          node scripts/check-signin-release-blockers.mjs
      - name: Verify full approved StaffPortal build
        run: npm run build
      - name: Confirm production protections remain closed
        shell: bash
        run: |
          test "$(node -p "require('./delivery/current-state.json').productionDeployAuthorized")" = "false"
          test "$(node -p "require('./delivery/current-state.json').productionMigrationAuthorized")" = "false"
