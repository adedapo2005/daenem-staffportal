name: StaffPortal Pre-Production Controller CI

on:
  workflow_dispatch:
  pull_request_review:
    types: [submitted]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/deploy-staffportal-staging.yml'
      - '.github/workflows/staffportal-release-controller-ci.yml'
      - 'delivery/PREPRODUCTION-GOVERNANCE.md'
      - 'scripts/check-preproduction-governance.mjs'
  push:
    branches:
      - 'release/staffportal-manual-staging-controller-20261018'
    paths:
      - '.github/workflows/deploy-staffportal-staging.yml'
      - '.github/workflows/staffportal-release-controller-ci.yml'
      - 'delivery/PREPRODUCTION-GOVERNANCE.md'
      - 'scripts/check-preproduction-governance.mjs'

permissions:
  contents: read

jobs:
  controller-check:
    name: Typecheck, Pages build, and API dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout controller candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: controller

      - name: Verify controller hardening
        working-directory: controller
        run: |
          test -f .github/workflows/deploy-staffportal-staging.yml
          grep -q 'name: Verify Exact SHA And One-Time Owner Approval' .github/workflows/deploy-staffportal-staging.yml
          grep -q 'Validate exact candidate, Owner approval, and one-time consumption' .github/workflows/deploy-staffportal-staging.yml
          grep -q 'approval_comment_id' .github/workflows/deploy-staffportal-staging.yml
          grep -q 'STAFFPORTAL STAGING APPROVAL CONSUMED SHA' .github/workflows/deploy-staffportal-staging.yml
          ! grep -qE '^  push:' .github/workflows/deploy-staffportal-staging.yml
          ! grep -q 'issue_comment:' .github/workflows/deploy-staffportal-staging.yml
          grep -q 'name: Release blockers clear' .github/workflows/deploy-staffportal-staging.yml
          grep -q 'signin-desktop-internal-scrollbar' .github/workflows/deploy-staffportal-staging.yml
          grep -q 'signin-weather-cache' .github/workflows/deploy-staffportal-staging.yml
          grep -q 'signin-password-state-styling' .github/workflows/deploy-staffportal-staging.yml
          RESOLVED_COUNT=$(grep -c "status: 'RESOLVED'" .github/workflows/deploy-staffportal-staging.yml)
          test "$RESOLVED_COUNT" -eq 3
          ! grep -Eq 'uses: actions/(checkout|setup-node|github-script)@(v|main|master)' .github/workflows/deploy-staffportal-staging.yml
          node scripts/check-preproduction-governance.mjs

      - name: Checkout official Pre-Production source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: preproduction/staffportal
          persist-credentials: false
          path: candidate

      - name: Use Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: candidate/package-lock.json

      - name: Install dependencies
        working-directory: candidate
        run: npm ci

      - name: Typecheck
        working-directory: candidate
        run: npm run typecheck

      - name: Pages build
        working-directory: candidate
        run: npm run build

      - name: API dry-run contracts
        working-directory: candidate
        run: |
          node scripts/check-delivery-controller.mjs
          node scripts/check-home-contract.mjs
          node scripts/check-staffportal-staging-integration.mjs
          node scripts/check-signin-release-blockers.mjs
          npm run check:postauth-live


  upload-preflight-read:
    name: Return To Previous StaffPortal Version After Failed Acceptance
    if: >-
      github.repository == 'adedapo2005/daenem-staffportal' &&
      github.actor == 'adedapo2005' &&
      github.event_name == 'pull_request_review' &&
      github.event.pull_request.head.ref == 'ops/staffportal-upload-preflight-read-20261105' &&
      github.event.review.body == 'STAFFPORTAL RETURN TO 47927e3c-827a-4b7a-842c-8bdd6e88883e AFTER FAILED ACCEPTANCE; OWNER APPROVED' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: staffportal-existing-worker-return-c7efd7d7
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    environment:
      name: staffportal-api-staging
      deployment: false
    steps:
      - name: Checkout Fixed Activation Candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            ops/staffportal-release-executor
      - name: Verify Existing Version And Prepare One-Time Intent
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -I .github/scripts/staffportal_return_previous_once.py prepare
      - name: Preserve Intent Before Activation
        id: intent
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: staffportal-return-intent-c7efd7d7-47927e3c
          path: |
            staffportal-activation-evidence/intent.json
            staffportal-activation-evidence/preflight.json
          if-no-files-found: error
          retention-days: 90
          overwrite: false
      - name: Return To Exact Previous Version Once And Read Back Allocation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          SP_INTENT_ARTIFACT_ID: ${{ steps.intent.outputs.artifact-id }}
          SP_INTENT_ARTIFACT_DIGEST: ${{ steps.intent.outputs.artifact-digest }}
        run: python3 -I .github/scripts/staffportal_return_previous_once.py activate
      - name: Preserve Sanitized Activation Result
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: staffportal-return-result-${{ github.run_id }}
          path: staffportal-activation-evidence
          if-no-files-found: error
          retention-days: 90
          overwrite: false
