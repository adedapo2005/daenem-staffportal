name: StaffPortal Pre-Production Controller CI

on:
  workflow_dispatch:
  pull_request_review:
    types: [submitted]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/deploy-staffportal-staging.yml'
      - '.github/workflows/staffportal-release-controller-ci.yml'
      - 'delivery/PREPRODUCTION-GOVERNANCE.md'
      - 'scripts/check-preproduction-governance.mjs'
  push:
    branches:
      - 'release/staffportal-manual-staging-controller-20261018'
    paths:
      - '.github/workflows/deploy-staffportal-staging.yml'
      - '.github/workflows/staffportal-release-controller-ci.yml'
      - 'delivery/PREPRODUCTION-GOVERNANCE.md'
      - 'scripts/check-preproduction-governance.mjs'

permissions:
  contents: read

jobs:
  controller-check:
    name: Typecheck, Pages build, and API dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout controller candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: controller

      - name: Verify controller hardening
        working-directory: controller
        run: |
          test -f .github/workflows/deploy-staffportal-staging.yml
          grep -q 'name: Verify Exact SHA And One-Time Owner Approval' .github/workflows/deploy-staffportal-staging.yml
          grep -q 'Validate exact candidate, Owner approval, and one-time consumption' .github/workflows/deploy-staffportal-staging.yml
          grep -q 'approval_comment_id' .github/workflows/deploy-staffportal-staging.yml
          grep -q 'STAFFPORTAL STAGING APPROVAL CONSUMED SHA' .github/workflows/deploy-staffportal-staging.yml
          ! grep -qE '^  push:' .github/workflows/deploy-staffportal-staging.yml
          ! grep -q 'issue_comment:' .github/workflows/deploy-staffportal-staging.yml
          grep -q 'name: Release blockers clear' .github/workflows/deploy-staffportal-staging.yml
          grep -q 'signin-desktop-internal-scrollbar' .github/workflows/deploy-staffportal-staging.yml
          grep -q 'signin-weather-cache' .github/workflows/deploy-staffportal-staging.yml
          grep -q 'signin-password-state-styling' .github/workflows/deploy-staffportal-staging.yml
          RESOLVED_COUNT=$(grep -c "status: 'RESOLVED'" .github/workflows/deploy-staffportal-staging.yml)
          test "$RESOLVED_COUNT" -eq 3
          ! grep -Eq 'uses: actions/(checkout|setup-node|github-script)@(v|main|master)' .github/workflows/deploy-staffportal-staging.yml
          node scripts/check-preproduction-governance.mjs

      - name: Checkout official Pre-Production source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: preproduction/staffportal
          persist-credentials: false
          path: candidate

      - name: Use Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: candidate/package-lock.json

      - name: Install dependencies
        working-directory: candidate
        run: npm ci

      - name: Typecheck
        working-directory: candidate
        run: npm run typecheck

      - name: Pages build
        working-directory: candidate
        run: npm run build

      - name: API dry-run contracts
        working-directory: candidate
        run: |
          node scripts/check-delivery-controller.mjs
          node scripts/check-home-contract.mjs
          node scripts/check-staffportal-staging-integration.mjs
          node scripts/check-signin-release-blockers.mjs
          npm run check:postauth-live

  upload-preflight-read:
    name: Install Corrected StaffPortal Frontend Once
    if: >-
      github.repository == 'adedapo2005/daenem-staffportal' &&
      github.actor == 'adedapo2005' &&
      github.event_name == 'pull_request_review' &&
      github.event.pull_request.head.ref == 'ops/staffportal-upload-preflight-read-20261105' &&
      github.event.review.body == 'STAFFPORTAL CORRECTED FRONTEND 20261106 ONCE; OWNER APPROVED' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: staffportal-existing-worker-corrected-frontend-20261106
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    environment:
      name: staffportal-api-staging
      deployment: false
    steps:
      - name: Checkout Exact Corrected Candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            ops/staffportal-release-executor
      - name: Authenticate Package And Check Current Serving Baseline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -I .github/scripts/staffportal_frontend_successor.py prepare
      - name: Preserve Exact Intent Before Any Cloudflare Mutation
        id: intent
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: staffportal-corrected-frontend-20261106-intent
          path: |
            staffportal-successor-evidence/intent.json
            staffportal-successor-evidence/preflight.json
          if-no-files-found: error
          retention-days: 90
          overwrite: false
      - name: Install Exact Successor And Verify Serving Allocation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          SP_INTENT_ARTIFACT_ID: ${{ steps.intent.outputs.artifact-id }}
          SP_INTENT_ARTIFACT_DIGEST: ${{ steps.intent.outputs.artifact-digest }}
        run: python3 -I .github/scripts/staffportal_frontend_successor.py execute
      - name: Preserve Sanitized Successor Result
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: staffportal-corrected-frontend-result-${{ github.run_id }}
          path: staffportal-successor-evidence
          if-no-files-found: error
          retention-days: 90
          overwrite: false



  corrected-settings-read:
    name: Read Corrected StaffPortal Settings Only
    if: >-
      github.repository == 'adedapo2005/daenem-staffportal' &&
      github.actor == 'adedapo2005' &&
      github.event_name == 'pull_request_review' &&
      github.event.pull_request.head.ref == 'ops/staffportal-upload-preflight-read-20261105' &&
      github.event.review.body == 'STAFFPORTAL READ CORRECTED SETTINGS 42148842172; GET ONLY'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    environment:
      name: staffportal-api-staging
      deployment: false
    steps:
      - name: Checkout Exact Read Candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Read Worker Settings And Serving Allocation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 -I .github/scripts/staffportal_read_corrected_settings.py
      - name: Preserve Fixed Settings Read
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: staffportal-corrected-settings-read-${{ github.run_id }}
          path: staffportal-corrected-settings-read.json
          if-no-files-found: error
          retention-days: 90
          overwrite: false

  corrected-frontend-resume:
    name: Resume Corrected StaffPortal Frontend Once
    if: >-
      github.repository == 'adedapo2005/daenem-staffportal' &&
      github.actor == 'adedapo2005' &&
      github.event_name == 'pull_request_review' &&
      github.event.pull_request.head.ref == 'ops/staffportal-upload-preflight-read-20261105' &&
      github.event.review.body == 'STAFFPORTAL RESUME FRONTEND AFTER VERIFIED SETTINGS 42149412898; OWNER APPROVED' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: staffportal-existing-worker-corrected-frontend-20261106
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    environment:
      name: staffportal-api-staging
      deployment: false
    steps:
      - name: Checkout Exact Corrected Candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            ops/staffportal-release-executor
      - name: Authenticate Package And Check Current Serving Baseline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -I .github/scripts/staffportal_resume_frontend.py prepare
      - name: Preserve Exact Intent Before Any Cloudflare Mutation
        id: intent
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: staffportal-corrected-frontend-20261106-resume-intent
          path: |
            staffportal-successor-resume-evidence/intent.json
            staffportal-successor-resume-evidence/preflight.json
          if-no-files-found: error
          retention-days: 90
          overwrite: false
      - name: Install Exact Successor And Verify Serving Allocation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          SP_INTENT_ARTIFACT_ID: ${{ steps.intent.outputs.artifact-id }}
          SP_INTENT_ARTIFACT_DIGEST: ${{ steps.intent.outputs.artifact-digest }}
        run: python3 -I .github/scripts/staffportal_resume_frontend.py execute
      - name: Preserve Sanitized Successor Result
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: staffportal-corrected-frontend-resume-result-${{ github.run_id }}
          path: staffportal-successor-resume-evidence
          if-no-files-found: error
          retention-days: 90
          overwrite: false


