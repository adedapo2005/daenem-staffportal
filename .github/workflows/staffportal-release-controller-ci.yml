name: StaffPortal Release Controller CI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/deploy-staffportal-staging.yml'
      - '.github/workflows/staffportal-release-controller-ci.yml'
  push:
    branches:
      - 'release/staffportal-manual-staging-controller-20261018'
    paths:
      - '.github/workflows/deploy-staffportal-staging.yml'
      - '.github/workflows/staffportal-release-controller-ci.yml'

permissions:
  contents: read

jobs:
  controller-check:
    name: Typecheck, Pages build, and API dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Use Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Pages build
        run: npm run build

      - name: API dry-run contracts
        run: |
          node scripts/check-delivery-controller.mjs
          node scripts/check-home-contract.mjs
          node scripts/check-staffportal-staging-integration.mjs
          npm run check:postauth-live