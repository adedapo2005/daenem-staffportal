name: Staff Portal CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "infra/**"
  pull_request:
    branches:
      - main
      - preproduction/staffportal
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: staffportal-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Non-production verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The Owner has frozen the approved Stage One Sign-In (2026-10-24).
      # Keep backend/post-login lanes moving, but fail any Pre-Production PR
      # that modifies the 128 frozen Sign-In code/media/widget files.
      - name: Enforce Owner-Locked Sign-In Baseline
        if: github.event_name == 'pull_request' && github.base_ref == 'preproduction/staffportal'
        run: node scripts/check-owner-signin-lock.mjs

      - name: Install dependencies
        run: npm ci
      - name: Validate delivery controller
        run: node scripts/check-delivery-controller.mjs

      - name: Permission-composed Home contract
        run: node scripts/check-home-contract.mjs

      - name: Dashboard permission contract
        run: npm run check:dashboard-permissions

      - name: Company-scoped access contract
        run: npm run check:company-scoped-access

      - name: Facilities company isolation regression
        run: node scripts/test-facilities-company-isolation.mjs

      - name: Facilities schedule reference integrity
        run: node scripts/test-facility-schedule-reference-scope.mjs

      - name: Facilities work order authority
        run: node scripts/test-facilities-work-order-authority.mjs

      - name: Facilities work order lifecycle
        run: node scripts/test-facilities-work-order-lifecycle.mjs

      - name: Isolated staging QA persona acceptance
        run: node --disable-warning=ExperimentalWarning scripts/test-staging-qa-seeder.mjs

      - name: Bakery stock, recipe, financial and unit-integrity regression
        run: |
          node --disable-warning=ExperimentalWarning scripts/test-bakery-real-stock-atomicity.mjs
          node --disable-warning=ExperimentalWarning scripts/test-bakery-http-stock-guards.mjs
          node --disable-warning=ExperimentalWarning scripts/test-bakery-recipe-cost-integrity.mjs
          node --disable-warning=ExperimentalWarning scripts/test-bakery-flour-unit-truth.mjs
          node --disable-warning=ExperimentalWarning scripts/test-bakery-material-unit-governance.mjs
          node --disable-warning=ExperimentalWarning scripts/test-bakery-material-receipt-cost.mjs
          node --disable-warning=ExperimentalWarning scripts/test-bakery-precise-material-valuation.mjs
          node --disable-warning=ExperimentalWarning scripts/test-bakery-finance-bridge.mjs
          node --disable-warning=ExperimentalWarning scripts/test-bakery-finance-ar-settlement-lock.mjs
          node --disable-warning=ExperimentalWarning scripts/test-bakery-remittance-idempotency.mjs
          node --disable-warning=ExperimentalWarning scripts/test-bakery-dispatch-close-atomicity.mjs
          node --disable-warning=ExperimentalWarning scripts/test-bakery-dispatch-custody-lock.mjs
          node --disable-warning=ExperimentalWarning scripts/test-bakery-dispatch-history-readonly.mjs
          node --disable-warning=ExperimentalWarning scripts/test-bakery-dispatch-history-api.mjs
          node scripts/check-bakery-changed-syntax.mjs
          node scripts/check-bakery-accountability.mjs
          node scripts/test-bakery-kpi-comparisons.mjs
          python3 scripts/test-bakery-integrity.py
          python3 scripts/test-bakery-agent-integrity.py
          python3 scripts/test-bakery-return-receipts.py
          python3 scripts/test-bakery-return-ui.py
          python3 scripts/test-bakery-dashboard-history.py
          python3 scripts/test-bakery-dashboard-permissions.py

      - name: Enterprise Command Center preservation and navigation
        run: |
          node scripts/test-navigation-overlay.mjs
          node scripts/check-command-center-navigation.mjs

      - name: Stage 1 palette catalogue and governed Appearance policy
        run: |
          node --test scripts/test-postlogin-palette-system.mjs
          node --test scripts/test-postlogin-palette-policy.mjs
          node --test scripts/test-stage1-accessibility.mjs
          node scripts/check-stage1-appearance-integration.mjs

      - name: V44 scoped settings contract
        run: node scripts/check-v44-scoped-settings.mjs

      - name: Staging Sites integration contract
        run: node scripts/check-staffportal-staging-integration.mjs

      - name: Build communications contract fixtures
        run: npx tsc worker/communications/index.ts --target ES2022 --module NodeNext --moduleResolution NodeNext --strict --skipLibCheck --types @cloudflare/workers-types --outDir .tmp-communications-test --rootDir . --noEmit false

      - name: Communications contracts
        run: node scripts/test-communications-contracts.mjs

      - name: Build communications remediation fixtures
        run: npx tsc worker/communications-dispatch.ts worker/communications-webhook.ts --target ES2022 --module NodeNext --moduleResolution NodeNext --strict --skipLibCheck --types @cloudflare/workers-types --outDir .tmp-communications-remediation --rootDir . --noEmit false
      - name: Communications remediation contracts
        run: node scripts/test-communications-remediation.mjs

      - name: TypeScript
        if: always()
        run: npm run typecheck

      - name: Build
        if: always()
        run: npm run build

      - name: Diff hygiene
        if: always()
        run: git diff --check

      - name: Safety assertion
        if: always()
        shell: bash
        run: |
          test "$(node -p "require('./delivery/current-state.json').farmsAccessAllowed")" = "false"
          test "$(node -p "require('./delivery/current-state.json').productionDeployAuthorized")" = "false"
          test "$(node -p "require('./delivery/current-state.json').productionMigrationAuthorized")" = "false"
          test "$(node -p "require('./delivery/current-state.json').liveMetaAuthorized")" = "false"
          echo "Staff Portal production and Farms safety gates remain closed."


  report:
    name: Publish verification status
    if: always()
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Publish commit status
        uses: actions/github-script@v7
        with:
          script: |
            const state = '${{ needs.verify.result }}' === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'Staff Portal CI / verify',
              description: state === 'success' ? 'All StaffPortal verification gates passed' : 'One or more StaffPortal verification gates failed',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

# This workflow intentionally contains no deployment, remote migration,
# production secret mutation, Meta activation, WhatsApp send, or PR merge step.
