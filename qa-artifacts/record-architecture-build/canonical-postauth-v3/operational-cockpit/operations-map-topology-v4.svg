<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="Decorative Europe, Africa, Middle East, Asia and Australia topology">
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#9ddcff"/>
      <stop offset=".42" stop-color="#86c8f2"/>
      <stop offset=".72" stop-color="#acdff8"/>
      <stop offset="1" stop-color="#e7f7ff"/>
    </linearGradient>
    <radialGradient id="oceanBloom" cx="58%" cy="45%" r="68%">
      <stop stop-color="#72dce9" stop-opacity=".28"/>
      <stop offset=".52" stop-color="#76b9ec" stop-opacity=".06"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="land" x1="0" y1="0" x2=".35" y2="1">
      <stop stop-color="#f7fcff"/>
      <stop offset=".55" stop-color="#d9f0fa"/>
      <stop offset="1" stop-color="#b7dff0"/>
    </linearGradient>
    <linearGradient id="landLight" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff" stop-opacity=".72"/>
      <stop offset="1" stop-color="#b6e2f3" stop-opacity=".18"/>
    </linearGradient>
    <pattern id="grid" width="60" height="56" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V56" fill="none" stroke="#fff" stroke-opacity=".2" stroke-width="1"/>
    </pattern>
    <filter id="landShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#317db8" flood-opacity=".15"/>
    </filter>
  </defs>

  <rect width="1200" height="560" fill="url(#ocean)"/>
  <rect width="1200" height="560" fill="url(#oceanBloom)"/>
  <rect width="1200" height="560" fill="url(#grid)"/>

